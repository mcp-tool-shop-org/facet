[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "facet-mcp"
version = "0.3.1"
description = "Query a governed decision record instead of reading it — facet's four-leg-verified SQLite+FTS5 index, served over MCP."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "mcp-tool-shop", email = "64996768+mcp-tool-shop@users.noreply.github.com" },
]
keywords = ["mcp", "model-context-protocol", "sqlite", "fts5", "provenance", "decision-record", "index"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "mcp>=2.0.0",
]

# The measurement server's instruments are subprocesses with their own imports,
# so the base install stays what the RECORD server needs: stdlib, sqlite3, mcp.
# That is also `bin/facet.js`'s stated precondition for the npm binary route,
# and it survives this change intact.
#
# `[measure]` IS THE HONEST CEILING, not a first tier with a bigger one behind
# it (E31 Ruling 6). It carries FOUR of the eight served tools - mesh_stats,
# mesh_topology, measure_report, anchor_check - which includes BOTH anchor
# tools, the half E14 Ruling 35's per-profile gate calls.
#
# ⛔ THERE IS NO `[measure-full]`, AND THAT IS MEASURED, NOT AN OMISSION. The
# other four instruments (reach_ceiling, thin_extent_curve, offsurface_rate,
# texel_provenance) need open3d. open3d 0.19.0 is the LATEST release, publishes
# cp38-cp312 wheels and NO sdist, while this package declares >=3.11 and the
# rig runs 3.13.13. The only cp313 build that exists is
# `0.19.0+241aaee` from Open3D's `main-devel` GitHub channel - an unreleased
# dev build, installed by direct URL, and A DIRECT-URL DEPENDENCY CANNOT BE
# DECLARED IN METADATA UPLOADED TO PyPI. So a full extra is not hard here, it
# is not expressible; declaring one would either lie or force
# `requires-python <3.13`, contradicting the interpreter this repo runs on.
# Those four tools refuse with the install line for what they need, and the
# gap is documented rather than papered over - a forced tier is worse than a
# named absence.
[project.optional-dependencies]
measure = [
    "numpy",
    "scipy",
    "trimesh",
    "pillow",
]

[project.urls]
Homepage = "https://mcp-tool-shop-org.github.io/facet/"
Handbook = "https://mcp-tool-shop-org.github.io/facet/handbook/"
Source = "https://github.com/mcp-tool-shop-org/facet"
Issues = "https://github.com/mcp-tool-shop-org/facet/issues"
Changelog = "https://github.com/mcp-tool-shop-org/facet/blob/main/CHANGELOG.md"

# Two commands, both already written and both already under test:
#   facet-mcp    the stdio MCP server (six tools, the four-leg verify as a
#                REFUSING health surface)  -> record_mcp.main
#   facet-index  the index itself: build / verify / q / claims -> facet_index.main
[project.scripts]
facet-mcp = "record_mcp:main"
facet-index = "facet_index:main"

# The modules ship AS THEY ARE, from tools/, as top-level modules. This is
# deliberate and it is the whole reason extraction costs nothing here: making
# tools/ a package would rewrite the `python tools/<name>.py` invocation that
# every recorded command in this repo's record uses, and those commands are
# citable evidence. py-modules + package-dir moves nothing.
#
# ⚑ CORRECTED 2026-08-09 (E31 Ruling 6), kept rather than rewritten because the
# correction is the useful part. The note above reasoned that packaging tools/
# WOULD rewrite the recorded invocation. MEASURED, IT DOES NOT: `python
# path/to/script.py` puts the script's own directory at sys.path[0] whether or
# not it also holds an `__init__.py`, so packaging changes no import statement,
# no sys.path insert and no file's location. E31 ran it - 108 -> 110 files, 7
# runnable with --help before and after, all exit 0, 0 compileall failures, and
# 52 instrument-invoking tests green, including every served tool's real
# subprocess call. The premise was never wrong to hold; it was wrong to hold
# UNMEASURED, and it cost `pip install facet-mcp` a measurement server.
#
# WHAT CHANGED AND WHY. `measure_mcp` and `subject_profile` join py-modules,
# and the two instrument directories are packaged, because the served tools
# invoke instruments as SUBPROCESSES and a wheel with 2 entries had nothing to
# invoke (E31 tier T0: 8 of 8 failing, at a layer before the resolver).
# Measured cost, recorded rather than discovered later: 58,401 B / 2 entries ->
# 509,413 B / 118, two generic top-level names on disk (`diagnostics`,
# `verify`), and 99 files under `diagnostics` of which the served surface uses
# five. A `packages = [...]` line ships the directory, not the eight.
#
# ⚑ AND NO `__init__.py` IS ADDED TO THE SOURCE TREE, which is not an
# oversight. A first pass added both, reasoning that a `packages` entry needs
# one. Measured on clean builds: it does not - setuptools ships every `.py` in
# an explicitly-listed directory either way, and an installed `mesh_stats`
# returns 786,432 faces on the box control from a clean venv either way.
# Adding them also FIRED A GATE: `instrument_census.py` keys axes D/E/G on the
# filename and halted with a duplicate-basename ANDON, because `__init__.py`
# would then exist in both homes. Nothing imports these directories - the
# server spawns instruments by path - so package-ness is not a property this
# route needs. T62 and T63 pin the absence with that reasoning.
[tool.setuptools]
package-dir = { "" = "tools" }
py-modules = ["facet_index", "record_mcp", "measure_mcp", "subject_profile"]
packages = ["diagnostics", "verify"]
