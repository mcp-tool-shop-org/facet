[pytest]
; E17 - the persistent harness (docs/experiments/E17-harness-kickoff.md).
; Two tiers: the hermetic set runs anywhere including CI; the `artifacts` set
; needs the recorded trees under FACET_ASSETS (default E:\AI\training on the
; rig) and SKIPS with a printed reason when they are absent - a silent skip is
; a check that cannot fail, so -rA keeps every skip reason in the summary.
testpaths = tests
addopts = -rA --strict-markers
markers =
    artifacts: needs the recorded trees under FACET_ASSETS (default E:\AI\training); NOT in git, NOT in CI - skipped with a printed reason when the tree is absent
    slow: a multi-minute measurement replay (raycast ladders, full projections)
    fold: rebuilds/verifies the derived index from the LIVE corpus; in a shared working copy this can race ANY concurrent write to the corpus (the corpus moving between leg-1's two builds), so deselect with -m "not fold" while one is live. THE CONCURRENT WRITER CAN BE THE SESSION RUNNING THE SUITE - this wording named "a concurrent advisor fold" until E23 Ruling 10, where an executor writing its own report and CHANGELOG entry while the suite ran failed this marker and correctly applied the run-then-rerun remedy. Writing docs during a suite run is the ordinary shape of a session's last hour, so it is the COMMON case, not the rare one: finish the run, or edit nothing under the corpus while it is in flight. The det_a temp-path race the E17 dispatch named is gone by construction since T13 (per-process temp names, E16 Ruling 3); these tests additionally build to a per-run scratch --db.
