# The repo's FIRST workflow (E17). Studio Actions rules binding:
# ubuntu only, paths-gated, workflow_dispatch fallback, required concurrency
# block, pinned minimal installs, and the HERMETIC set only - the artifacts
# tier needs the recorded trees under E:\AI\training, which are not in git and
# not here; those tests skip by design, so CI deselects them outright.
name: ci

on:
  push:
    paths:
      - "tools/**"
      - "tests/**"
      - "pytest.ini"
      - ".mcp.json"
      - ".github/workflows/**"
      # the extraction's packaging surface (2026-08-08). T27 asserts that the
      # version in pyproject.toml, package.json, bin/facet.js and record_mcp.py
      # all agree, because bin/facet.js installs an EXACT pinned version from
      # PyPI. Without these paths a one-line version bump in package.json alone
      # would skip CI and the drift would surface at a user's `npx`, not here.
      - "pyproject.toml"
      - "package.json"
      - "bin/**"
      # THE DECLARATION (2026-08-11, S02). `conventions.json` is not
      # documentation about the index - it IS the index's rules: what a ruling
      # header looks like, which files are current-state, which arcs a law may
      # be paid for by. T24 now asserts against it directly, and a one-line
      # edit here can move what every parser test reads while touching nothing
      # else in this list. Exactly the `package.json` argument above, one file
      # over. NOT `docs/index/**` - the db and its certificate are DERIVED and
      # land in a terminal commit of their own, so widening to the directory
      # would fire CI on an artifact that has no test of its own to run.
      - "docs/index/conventions.json"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hermetic:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0, not the default 1. T84's diff leg reads the 1.0.0 blob of
      # tools/callieri_border.py (ecdcbac) with `git cat-file`, and the property
      # it proves is "the shipped diff is exactly the 1.0.0 -> 1.0.1 delta". HEAD
      # carries cf8c517 (the repaired 1.0.1 form) since d8fabb2, so ecdcbac is
      # reachable only through history - and a depth-1 clone has none. The test
      # passed on the rig (803 commits present) and failed here with exit 128,
      # which is the shape of a check that is hermetic with respect to training
      # assets and NOT with respect to clone depth.
      #
      # E23's boundary, applied: a red gate may be repaired when the repair ADDS
      # CAPABILITY rather than removing coverage, and the coverage-removing
      # alternatives are named and rejected in writing. Rejected: (a) skipping
      # the leg when the blob is unreachable - that is exactly the "narrow the
      # test until the gate goes green" move the boundary forbids, and it would
      # silently disarm the only check that the released diff matches the
      # version it claims to patch; (b) vendoring the 1.0.0 source into tests/
      # as a fixture - hermetic, but it duplicates a file whose whole point is
      # being the git object, so the copy could drift from the blob the diff's
      # own index line names. Full history on an 803-commit repo is cheap.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 3.12, not the rig's 3.13: open3d (imported at texpass_iter's module
      # level, so T3's guard test needs it importable) publishes wheels for
      # 3.12 at the pinned release; the rig runs a local 0.19 build. Versions
      # below are the trellis2-env's own, recorded in the E17 report.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # mcp 2.0.0 (E18): the official Python SDK, the current release verified
      # on PyPI 2026-08-08 and pinned here in the same commit as the first test
      # that needs it. tools/record_mcp.py imports it at module level, so it is
      # in conftest's measured interpreter table beside open3d - a runner
      # without it produces the partial-green misreading E17 Ruling 2 closed.
      # opencv-python-headless (E23): tools/restylize_views.py imports cv2 at
      # MODULE level, and E23's T31 is the first test in this repo's history to
      # invoke any of the twelve route tools - so this runner had never needed
      # it. Found by CI failing, not by reading: the rig carries
      # opencv-python 4.13.0.92, and this is the headless twin of that exact
      # version because the runner has no display. Same rule as mcp above -
      # pinned in the same commit as the first test that needs it.
      # build (E24 Ruling 3): T32 builds a wheel, installs it into a temp venv
      # and runs a VERB - the check that would have caught a defect FOUR
      # RELEASES shipped, because the only wheel check ever run was `--help`.
      # Without this pin those five legs SKIP here while passing on the rig,
      # which is the defect's own shape: a check present where it is not needed
      # and absent from the gate that fires on every push. The skip was loud
      # (`-rA` printed the reason) and reported rather than left to a green
      # tick - it is closed here rather than admired. 1.5.0 is the rig's
      # version. The BUILD half needs network, and since 2026-08-11 so does one
      # step of the INSTALL half: T32's fixture resolves facet's one declared
      # runtime dependency from PyPI (read out of pyproject, not transcribed)
      # and keeps `--no-index --no-deps` for the wheel itself, so `mcp` stays
      # out of that venv and the legs still prove the index command stands
      # alone.
      # record-index 0.1.0 (S02): the index was EXTRACTED to its own package and
      # tools/facet_index.py imports it at MODULE level, so it belongs in
      # conftest's measured interpreter table beside mcp and cv2. Without it
      # every test that touches the index dies at import and the run reads as a
      # suite defect rather than an environment one - the exact misreading E17
      # Ruling 2 closed. Pinned to the version the rig carries; it has no
      # dependencies of its own, so this adds one wheel and nothing transitive.
      - name: install pinned test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==9.1.1 numpy==2.4.6 scipy==1.17.1 \
            pillow==12.2.0 trimesh==4.12.2 open3d==0.19.0 mcp==2.0.0 \
            opencv-python-headless==4.13.0.92 build==1.5.0 \
            record-index==0.1.0
      - name: hermetic set
        run: python -m pytest -m "not artifacts"

      # D3, newly applicable at the extraction (2026-08-08). Before it, the SKIP
      # was honest - there was no dependency manifest, so no graph for a scanner
      # to read. There are two now: pyproject.toml declares mcp, package.json
      # declares @mcptoolshop/npm-launcher. Both are scanned against the
      # PUBLISHED surface, not the test pins above, because the test pins are
      # this repo's development environment and the manifests are what a user
      # installs.
      # Audited in a CLEAN venv containing only the package, not in the test
      # environment above - the test pins are this repo's development set, and
      # what a user installs is `facet-mcp` plus `mcp`. Scanning the wrong
      # population is how a dependency gate reports on something nobody ships.
      #
      # `pip install --upgrade pip` FIRST is load-bearing, measured not guessed:
      # pip 26.0.1 itself carries four advisories (PYSEC-2026-196/2875/2876), so
      # auditing without upgrading fails red on the INSTALLER, not on facet's
      # dependencies. pip 26.2.1 reports clean. The org's note about
      # `--ignore-vuln` for pip is therefore not needed here - upgrading is the
      # honest fix and ignoring would have hidden a real signal later.
      #
      # NOT --strict: it treats a skipped editable self-package as an error even
      # with zero vulnerabilities (earned on xrpl-lab). It still fails on a real
      # vulnerability.
      - name: dependency scan - python (published surface)
        run: |
          python -m venv /tmp/audit
          /tmp/audit/bin/python -m pip install --quiet --upgrade pip
          /tmp/audit/bin/python -m pip install --quiet . pip-audit
          /tmp/audit/bin/pip-audit --skip-editable

      # `npm audit` REQUIRES a lockfile and this repo deliberately commits none
      # (the org's wrapper convention - see D7). Resolve one in place with
      # --package-lock-only, which writes the tree without installing anything,
      # then audit that. Without this the step goes red on "npm audit requires
      # an existing lockfile", which would be shipping a broken gate to satisfy
      # a checkbox.
      - name: dependency scan - npm (published surface)
        run: |
          npm install --package-lock-only --omit=dev --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
