name: Release

# ONE workflow, BOTH registries, plus the binaries npm-launcher fetches at run
# time. Both trusted publishers - PyPI's pending publisher for `facet-mcp` and
# npm's for `@mcptoolshop/facet` - are bound to this exact filename, so it must
# never be renamed; npm masks that failure as a 404 rather than an auth error.
#
# Publishing here rather than chaining a downstream workflow is deliberate: a
# Release created with GITHUB_TOKEN does NOT fire `release: published`
# (GitHub's recursion guard), which silently skipped PyPI and binaries on
# xrpl-lab v1.7.1.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write      # GitHub Release + asset upload
  id-token: write      # OIDC for BOTH npm provenance and PyPI trusted publishing

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # The binaries npm-launcher downloads. Naming is LOCKED by its platform table
  # (src/platform.js): <tool>-<version>-<os>-<arch>[.exe], where win32 maps to
  # the string "win", not "windows". A mismatch here is a 404 at the user's npx.
  # macOS is not built - the org drops it at ~10x Linux cost; darwin users get
  # npm-launcher's own "no checksum for asset" error listing what does exist.
  # ---------------------------------------------------------------------------
  binaries:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
            ext: ''
          - os: windows-latest
            label: win-x64
            ext: '.exe'

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install the package and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pyinstaller==6.22.0

      # `--exclude-module mcp.cli` is load-bearing and was found by building it:
      # mcp.cli imports typer and calls sys.exit(1) at import time when typer is
      # absent, which aborts PyInstaller's analysis. record_mcp only ever imports
      # mcp.server.mcpserver and mcp.types.
      - name: Build the single-file binary
        shell: bash
        run: |
          pyinstaller --onefile --name facet \
            --paths tools \
            --exclude-module mcp.cli \
            --exclude-module typer \
            --exclude-module IPython \
            --console --noconfirm \
            tools/record_mcp.py

      - name: Name it by the launcher's convention
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p out
          mv "dist/facet${{ matrix.ext }}" "out/facet-${VERSION}-${{ matrix.label }}${{ matrix.ext }}"
          ls -l out/

      - name: Smoke-test the binary before it can ever reach a user
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BIN="out/facet-${VERSION}-${{ matrix.label }}${{ matrix.ext }}"
          chmod +x "$BIN" || true
          "$BIN" --print-tools

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: binary-${{ matrix.label }}
          path: out/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  release:
    name: Publish PyPI + npm, cut the Release
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # THE VERSION GATE. Four sites declare this version and all four must
      # match the tag, because bin/facet.js pins an EXACT tag and asset name.
      # Drift ships a wrapper that 404s at a user's npx rather than failing here.
      - name: Verify tag matches every declared version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PYPROJECT=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          PKGJSON=$(node -p "require('./package.json').version")
          # Extracted with python, NOT a node one-liner. The obvious node version
          # uses a regex replacement containing $1, and bash expands $1 inside
          # double quotes to an empty positional parameter - the JSON.parse then
          # dies and takes the whole release with it. Caught in pre-flight.
          BINJS=$(python -c "import re,pathlib;print(re.search(r'version:\s*\"([^\"]+)\"', pathlib.Path('bin/facet.js').read_text()).group(1))")
          BINTAG=$(python -c "import re,pathlib;print(re.search(r'tag:\s*\"([^\"]+)\"', pathlib.Path('bin/facet.js').read_text()).group(1))")
          if [ "$BINTAG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::bin/facet.js pins tag $BINTAG but this release is $GITHUB_REF_NAME - npm-launcher would fetch the wrong release"
            exit 1
          fi
          SERVER=$(python -c "import re,pathlib;print(re.search(r'SERVER_VERSION = \"([^\"]+)\"', pathlib.Path('tools/record_mcp.py').read_text()).group(1))")
          echo "tag=$TAG pyproject=$PYPROJECT package.json=$PKGJSON bin/facet.js=$BINJS record_mcp=$SERVER"
          fail=0
          for pair in "pyproject:$PYPROJECT" "package.json:$PKGJSON" "bin/facet.js:$BINJS" "record_mcp.py:$SERVER"; do
            name="${pair%%:*}"; val="${pair#*:}"
            if [ "$val" != "$TAG" ]; then echo "::error::$name declares $val but the tag is $TAG"; fail=1; fi
          done
          [ "$fail" -eq 0 ]

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: binary-*
          merge-multiple: true
          path: assets

      # GNU coreutils format, two spaces - npm-launcher's parseChecksumsTxt
      # matches /^([a-f0-9]{64})\s{1,2}(.+)$/ and keys the map on the BASENAME,
      # so this must be generated from inside the directory.
      - name: Generate checksums
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd assets
          sha256sum * > "checksums-${VERSION}.txt"
          cat "checksums-${VERSION}.txt"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      # THIS STEP IS THE GATE THAT SHOULD HAVE CAUGHT E24, AND DID NOT.
      #
      # It ran `--help` and `--print-tools`, and it was green through v0.1.0,
      # v0.1.1, v0.2.0 and v0.3.0 while `pip install facet-mcp` could not find
      # the record at all: the wheel ships facet_index as a TOP-LEVEL module, so
      # the root resolved to <venv>/Lib and `build`, `claims` and `q` without
      # --db all failed on a user's machine. Neither of those two commands
      # touches a corpus or a database, so neither could ever have seen it.
      #
      # A verification step named "verify the wheel runs" must RUN WHAT A USER
      # RUNS. The two original commands are kept below - as a floor, not as the
      # gate - precisely because their being green proves nothing, and leaving
      # them in place says so at the site.
      - name: Verify the wheel runs from a clean venv
        run: |
          set -euo pipefail
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install --quiet dist/*.whl

          # the floor: what this step used to be, in full
          /tmp/verify/bin/facet-index --help > /dev/null
          /tmp/verify/bin/facet-mcp --print-tools > /dev/null

          # A VERB THAT TOUCHES THE CORPUS. `build` is the one that died with
          # FileNotFoundError on <venv>/Lib/docs/experiments. It writes to a
          # scratch path so the tracked index is never the thing under test.
          /tmp/verify/bin/facet-index build --db /tmp/verify/index.db > /dev/null

          # A VERB THAT TOUCHES THE DB, with no --db, which is how the default
          # gets exercised at all. This exited 2 with "unable to open database
          # file" on every published wheel.
          /tmp/verify/bin/facet-index q erosion > /dev/null

          # THE REFUSAL, from a directory that is not the record: 4 = REFUSED
          # (E21 Ruling 4). A non-zero here is not enough - 2 is what the DEFECT
          # returned, so this asserts the exact code.
          rc=0
          ( cd /tmp && /tmp/verify/bin/facet-index build ) > /dev/null 2>&1 || rc=$?
          if [ "$rc" -ne 4 ]; then
            echo "expected 4 = REFUSED outside a checkout, got $rc" >&2
            exit 1
          fi

          # And the server's own banner must name a path inside this checkout.
          # The 0.1.0 binary printed a path under its extraction dir and exited
          # 0; the wheel printed one under <venv>/Lib and exited 0.
          db=$(/tmp/verify/bin/facet-mcp --print-tools | sed -n 's/^db: *//p' | head -1)
          case "$db" in
            "$PWD"/*) ;;
            *) echo "the banner names a path outside the checkout: $db" >&2; exit 1 ;;
          esac
          echo "verbs run, the refusal returns 4, and the banner names $db"

      # The Release must exist WITH its assets before anyone can npx: the
      # launcher fetches checksums + binary from this tag at run time.
      - name: Cut the GitHub Release with binaries + dists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "facet ${GITHUB_REF_NAME}" \
            --notes-file ".github/release-notes-${GITHUB_REF_NAME}.md" \
            --verify-tag \
            assets/* dist/*

      - name: Publish to PyPI (OIDC trusted publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

      # Node 22 ships npm 10.9, which signs provenance but cannot negotiate the
      # OIDC auth path (the registry PUT returns a misleading 404). In-place
      # `npm i -g npm@latest` races the bundled arborist and breaks, so install
      # into a sandbox and shadow it on PATH.
      - name: Install npm >=11.5 in a sandbox for OIDC
        run: |
          SANDBOX="$HOME/.npm-cli-sandbox"
          mkdir -p "$SANDBOX"
          pushd "$SANDBOX" >/dev/null
          echo '{"name":"npm-cli-sandbox","version":"0.0.0","private":true}' > package.json
          npm install --no-save --no-audit --no-fund --silent npm@latest
          popd >/dev/null
          echo "$SANDBOX/node_modules/.bin" >> "$GITHUB_PATH"
          "$SANDBOX/node_modules/.bin/npm" --version

      - name: npm pack dry-run (verify tarball shape)
        run: npm pack --dry-run

      - name: Publish to npm with provenance (OIDC trusted publisher)
        run: npm publish --provenance --access public
