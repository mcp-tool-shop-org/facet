name: Release

# ONE workflow, BOTH registries. Both trusted publishers - PyPI's pending
# publisher for `facet-mcp` and npm's for `@mcptoolshop/facet` - are bound to
# this exact filename, so it must not be renamed.
#
# Publishing both here rather than chaining a downstream workflow is deliberate:
# a GitHub Release created with GITHUB_TOKEN does NOT fire `release: published`
# (GitHub's recursion guard), which silently skipped PyPI + binaries on xrpl-lab
# v1.7.1. No chain, no gotcha.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write      # GitHub Release creation
  id-token: write      # OIDC for BOTH npm provenance and PyPI trusted publishing

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish to PyPI + npm, then cut the GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # THE VERSION GATE. Four places carry this version and all four must agree
      # with the tag before anything irreversible happens. This is what makes it
      # safe for bin/facet.js to pin an exact PyPI version.
      - name: Verify tag matches every declared version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PYPROJECT=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          PKGJSON=$(node -p "require('./package.json').version")
          BINJS=$(node -p "(require('fs').readFileSync('bin/facet.js','utf8').match(/const VERSION = \"([^\"]+)\"/)||[])[1]")
          SERVER=$(python -c "import re,pathlib;print(re.search(r'SERVER_VERSION = \"([^\"]+)\"', pathlib.Path('tools/record_mcp.py').read_text()).group(1))")
          echo "tag=$TAG pyproject=$PYPROJECT package.json=$PKGJSON bin/facet.js=$BINJS record_mcp=$SERVER"
          fail=0
          for pair in "pyproject:$PYPROJECT" "package.json:$PKGJSON" "bin/facet.js:$BINJS" "record_mcp.py:$SERVER"; do
            name="${pair%%:*}"; val="${pair#*:}"
            if [ "$val" != "$TAG" ]; then echo "::error::$name declares $val but the tag is $TAG"; fail=1; fi
          done
          [ "$fail" -eq 0 ]

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build sdist + wheel
        run: python -m build

      - name: Verify the wheel imports and exposes both entry points
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install --quiet dist/*.whl
          /tmp/verify/bin/facet-index --help > /dev/null
          /tmp/verify/bin/facet-mcp --print-tools > /dev/null
          echo "both console scripts run from a clean venv"

      # PyPI first: bin/facet.js installs facet-mcp from PyPI, so the npm
      # package is broken until the Python package exists. Order is load-bearing.
      - name: Publish to PyPI (OIDC trusted publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

      # Node 22 ships npm 10.9, which signs provenance but cannot negotiate the
      # OIDC auth path - the registry PUT returns a misleading 404. In-place
      # `npm i -g npm@latest` races the bundled arborist and breaks
      # irrecoverably, so install into a sandbox and shadow it on PATH.
      - name: Install npm >=11.5 in a sandbox for OIDC
        run: |
          SANDBOX="$HOME/.npm-cli-sandbox"
          mkdir -p "$SANDBOX"
          pushd "$SANDBOX" >/dev/null
          echo '{"name":"npm-cli-sandbox","version":"0.0.0","private":true}' > package.json
          npm install --no-save --no-audit --no-fund --silent npm@latest
          popd >/dev/null
          echo "$SANDBOX/node_modules/.bin" >> "$GITHUB_PATH"
          "$SANDBOX/node_modules/.bin/npm" --version

      - name: npm pack dry-run (verify tarball shape)
        run: npm pack --dry-run

      - name: Publish to npm (OIDC trusted publisher, with provenance)
        run: npm publish --provenance --access public

      - name: Cut the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "facet ${GITHUB_REF_NAME}" \
            --notes-file .github/release-notes-${GITHUB_REF_NAME}.md \
            --verify-tag \
            dist/*
